# Put this at .github/workflows/amazon-jp-watch.yml in a private repo
# alongside amazon_jp_watcher.py. Add DISCORD_WEBHOOK_URL as a repo secret.
name: amazon-jp-watch

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, off the hour
  workflow_dispatch:          # manual run button

permissions:
  contents: write             # needed to commit the seen-IDs file back

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python amazon_jp_watcher.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Persist seen IDs
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add seen_amazon_jp.json
          git diff --cached --quiet || git commit -m "update seen Amazon JP postings"
          git push
